<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Source for the "any" app icons. Run scripts/make-icons.sh after editing. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g id="mark">
    <!-- "A" built from strokes so it doesn't depend on fonts -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <path d="M136 392 L256 118 L376 392" stroke-width="66"/>
      <path d="M190 296 L322 296" stroke-width="54"/>
    </g>
    <!-- A blue counter and an amber diamond, like the ten-frame tokens -->
    <circle cx="227" cy="378" r="24" fill="#3b82f6" stroke="#ffffff" stroke-width="6"/>
    <rect x="270" y="359" width="38" height="38" rx="6" fill="#fbbf24" transform="rotate(45 289 378)"/>
  </g>
</svg>
