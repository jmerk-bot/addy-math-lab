name: Deploy to GitHub Pages

# Every push to main publishes the app. The tablet picks up the new version
# the next time the app is opened or brought back to the foreground.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build site with version stamp
        run: |
          VERSION="$(date -u +%Y.%m.%d-%H%M)-${GITHUB_SHA::7}"
          mkdir _site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.claude' \
            --exclude 'scripts' --exclude '_site' --exclude '*.md' \
            ./ _site/
          sed -i "s/__APP_VERSION__/${VERSION}/g" _site/sw.js _site/js/version.js
          echo "{\"version\":\"${VERSION}\"}" > _site/version.json
          echo "Version: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
